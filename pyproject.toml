[project]
name = "mini-codex"
version = "0.1.0"
description = "Local-first, terminal-based AI coding agent powered by Groq."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.11.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mini-codex = "mini_codex.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_codex"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: tests that call the real Groq API (skipped unless MINI_CODEX_LIVE=1)",
]
